# 開催日の未発走オッズを定期取得し、変化があれば main に commit & push する。
# Vercel は main push で再デプロイされる想定。
name: Refresh JRA odds

on:
  schedule:
    # 毎時0分（JST 開催帯を広くカバー）
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-jra-odds
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh today's odds and results
        run: |
          npm run fetch:jra:odds
          npm run fetch:jra:results

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/snapshots; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/snapshots
          git commit -m "chore: refresh JRA odds snapshot ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
