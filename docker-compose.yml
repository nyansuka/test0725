services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      # OneDrive 配下の .next キャッシュ不整合を避ける
      - web_next:/app/.next
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

volumes:
  web_node_modules:
  web_next:
