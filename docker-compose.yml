services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      # OneDrive 配下の .next キャッシュ不整合を避ける
      - web_next:/app/.next
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - path: .env.local
        required: false
    stdin_open: true
    tty: true

  # 発走後に結果を自動取得（デフォルト90秒間隔）
  fetcher:
    build: .
    command: ["node", "scripts/watch-jra-snapshot.mjs"]
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      - INTERVAL_SEC=90
      - GRACE_MIN=8
    restart: unless-stopped

volumes:
  web_node_modules:
  web_next:
